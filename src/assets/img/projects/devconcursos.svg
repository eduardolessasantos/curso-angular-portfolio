<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDevConcursos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accentDevConcursos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" rx="12" fill="url(#bgDevConcursos)"/>
  
  <!-- Flashcard layer background -->
  <rect x="55" y="45" width="190" height="110" rx="8" fill="#4338ca" opacity="0.4" transform="rotate(-6 150 100)"/>
  <!-- Flashcard front -->
  <rect x="55" y="45" width="190" height="110" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  
  <!-- Content on card -->
  <circle cx="85" cy="72" r="10" fill="url(#accentDevConcursos)"/>
  <path d="M82 72l2 2 4-4" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <text x="105" y="76" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">DevConcursos TI</text>
  <text x="70" y="105" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Flashcards SRS • TI &amp; Bancas</text>
  <text x="70" y="125" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10">Active Recall • Cebraspe/FGV</text>

  <!-- SRS Badge -->
  <rect x="70" y="136" width="60" height="15" rx="4" fill="#3730a3"/>
  <text x="76" y="147" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SRS Algorithm</text>
</svg>
